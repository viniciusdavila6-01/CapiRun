- name: 4. Compilar e Empacotar no Container UE 5.4 (Win64)
        run: |
          chmod -R 777 "$GITHUB_WORKSPACE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            ghcr.io/epicgames/unreal-engine:dev-slim-5.4.4 \
            /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh BuildCookRun \
              -project="/project/CapiRun.uproject" \
              -noP4 -platform=Win64 -clientconfig=Development \
              -cook -allmaps -build -stage -pak -archive \
              -archivedirectory="/project/BuildOutput" \
              -nullrhi -unattended -utf8output
