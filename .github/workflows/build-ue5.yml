name: Build CapiRun (UE 5.4 Linux)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UE_IMAGE: ghcr.io/epicgames/unreal-engine:dev-slim-5.4.4

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then echo "::error::Secret GHCR_TOKEN ausente no repositorio"; exit 1; fi
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
      - name: Pull engine image
        run: docker pull "$UE_IMAGE"
      - name: BuildCookRun
        run: |
          sudo chown -R 1000:1000 "${GITHUB_WORKSPACE}"
          docker run --rm -e GITHUB_WORKSPACE -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" "$UE_IMAGE" bash -c '
            /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh BuildCookRun \
              -project="${GITHUB_WORKSPACE}/CapiRun.uproject" -noP4 -platform=Linux \
              -clientconfig=Development -cook -allmaps -build -stage -pak -archive \
              -archivedirectory="${GITHUB_WORKSPACE}/BuildOutput" \
              -nullrhi -unattended -utf8output'
      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"
      - uses: actions/upload-artifact@v4
        with:
          name: CapiRun-Linux
          path: BuildOutput
