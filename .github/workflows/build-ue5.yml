name: Build CapiRun (UE 5.4 Linux)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/epicgames/unreal-engine:dev-slim-5.4.4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}
      options: --user root
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - uses: actions/checkout@v4
      - name: BuildCookRun
        run: |
          /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh BuildCookRun \
            -project="${GITHUB_WORKSPACE}/CapiRun.uproject" -noP4 -platform=Linux \
            -clientconfig=Development -cook -allmaps -build -stage -pak -archive \
            -archivedirectory="${GITHUB_WORKSPACE}/BuildOutput" \
            -nullrhi -unattended -utf8output
      - uses: actions/upload-artifact@v4
        with:
          name: CapiRun-Linux
          path: BuildOutput
