name: Build CapiRun (UE 5.4 Linux)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Liberar espaco em disco (35 GB livres)
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af
          df -h

      - name: 2. Baixar codigo do projeto CapiRun
        uses: actions/checkout@v4

      - name: 3. Login no Registro da Epic Games (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 4. Compilar e Empacotar no Container UE 5.4
        run: |
          chmod -R 777 "${{ github.workspace }}"
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            ghcr.io/epicgames/unreal-engine:dev-slim-5.4.4 \
            /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh BuildCookRun \
              -project="/project/CapiRun.uproject" \
              -noP4 -platform=Linux -clientconfig=Development \
              -cook -allmaps -build -stage -pak -archive \
              -archivedirectory="/project/BuildOutput" \
              -nullrhi -unattended -utf8output

      - name: 5. Salvar Jogo Compilado (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CapiRun-Linux-Build
          path: ${{ github.workspace }}/BuildOutput
